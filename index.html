<!DOCTYPE html>
<html lang="pt-br" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List Elegante</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1',
                        primaryLight: '#818cf8',
                        primaryDark: '#4f46e5',
                        secondary: '#f9fafb',
                        accent: '#10b981',
                        dark: '#1e293b',
                    },
                    boxShadow: {
                        'soft': '0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05)',
                        'lg': '0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .task-card {
            transition: all 0.2s ease;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #475569;
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen flex items-center justify-center p-4 transition-colors duration-300">
    <div class="w-full max-w-md bg-white dark:bg-gray-800 rounded-2xl shadow-soft p-6 sm:p-8 border border-gray-100 dark:border-gray-700">
        <header class="mb-8">
            <div class="flex items-center justify-between mb-6">
                <h1 class="text-2xl sm:text-3xl font-extrabold text-primaryDark dark:text-white">Today's Tasks</h1>
                <button id="theme-toggle" class="p-3 rounded-xl bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-yellow-400 hover:rotate-12 transition-all duration-300 shadow-sm">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
            
            <div class="flex items-center space-x-2">
                <input type="text" id="task-input" placeholder="What needs to be done?" 
                    class="flex-grow bg-gray-100 dark:bg-gray-700 border-none rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary dark:focus:ring-primary/50 focus:outline-none text-gray-800 dark:text-white placeholder-gray-400 text-sm sm:text-base">
                <button id="add-task-btn" 
                    class="bg-primary hover:bg-primaryDark text-white px-4 py-3 rounded-xl transition-all duration-200 flex items-center justify-center shadow-md hover:shadow-lg active:scale-95">
                    <i class="fas fa-plus mr-2"></i> <span class="hidden sm:inline">Add Task</span>
                </button>
            </div>
        </header>
        
        <div id="tasks-container" class="max-h-[400px] overflow-y-auto pr-2 custom-scrollbar">
            <!-- Tarefas serão inseridas aqui -->
        </div>
        
        <div class="mt-8 pt-6 border-t border-gray-100 dark:border-gray-700 flex justify-between items-center">
            <div class="text-gray-500 dark:text-gray-400 text-sm">
                <p>Completed: <span id="completed-count" class="font-bold text-accent">0</span></p>
                <p>Total: <span id="total-count" class="font-bold">0</span></p>
            </div>
        </div>

        <footer class="mt-8 pt-4 text-center">
            <p class="text-gray-400 dark:text-gray-500 text-xs">
                Made by <span class="font-semibold text-primary">Eduardo Baia</span>
            </p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tasksContainer = document.getElementById('tasks-container');
            const taskInput = document.getElementById('task-input');
            const addTaskBtn = document.getElementById('add-task-btn');
            const completedCount = document.getElementById('completed-count');
            const totalCount = document.getElementById('total-count');
            const themeToggle = document.getElementById('theme-toggle');

            let tasks = JSON.parse(localStorage.getItem('tasks')) || [];

            // Lógica de Tema
            function initTheme() {
                const savedTheme = localStorage.getItem('theme');
                if (savedTheme === 'dark') {
                    document.documentElement.classList.add('dark');
                    updateThemeIcon('moon');
                } else {
                    document.documentElement.classList.remove('dark');
                    updateThemeIcon('sun');
                }
            }

            function updateThemeIcon(mode) {
                const icon = mode === 'moon' ? 'moon' : 'sun';
                themeToggle.innerHTML = `<i class="fas fa-${icon}"></i>`;
            }

            themeToggle.addEventListener('click', () => {
                const isDark = document.documentElement.classList.toggle('dark');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                updateThemeIcon(isDark ? 'moon' : 'sun');
            });

            // Funções de Tarefas
            function updateCounters() {
                const total = tasks.length;
                const completed = tasks.filter(task => task.completed).length;
                totalCount.textContent = total;
                completedCount.textContent = completed;
            }
            
            function addTask() {
                const text = taskInput.value.trim();
                if (text === '') return;
                
                const newTask = {
                    id: Date.now(),
                    text: text,
                    completed: false,
                    createdAt: new Date().toISOString()
                };
                
                tasks.unshift(newTask);
                saveTasks();
                renderTasks();
                taskInput.value = '';
            }
            
            function completeTask(id) {
                const task = tasks.find(task => task.id === id);
                if (task) {
                    task.completed = !task.completed;
                    saveTasks();
                    renderTasks();
                }
            }
            
            function removeTask(id) {
                tasks = tasks.filter(task => task.id !== id);
                saveTasks();
                renderTasks();
            }
            
            function saveTasks() {
                localStorage.setItem('tasks', JSON.stringify(tasks));
                updateCounters();
            }
            
            function renderTasks() {
                tasksContainer.innerHTML = '';
                
                if (tasks.length === 0) {
                    tasksContainer.innerHTML = `
                        <div class="text-center py-8 text-gray-400">
                            <i class="fas fa-clipboard-list text-4xl mb-2 opacity-20"></i>
                            <p>Nenhuma tarefa por aqui...</p>
                        </div>
                    `;
                    return;
                }

                tasks.forEach((task) => {
                    const taskElement = document.createElement('div');
                    taskElement.className = 'task-card flex items-center justify-between p-4 mb-3 bg-gray-100 dark:bg-gray-700/50 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm hover:shadow-md';
                    
                    taskElement.innerHTML = `
                        <div class="flex items-center space-x-3 w-full">
                            <button 
                                onclick="window.handleTaskComplete(${task.id})"
                                class="w-6 h-6 rounded-full border-2 ${task.completed ? 'bg-accent border-accent' : 'border-gray-300 dark:border-gray-500'} flex items-center justify-center transition-colors"
                                title="Marcar como concluída">
                                ${task.completed ? '<i class="fas fa-check text-white text-xs"></i>' : ''}
                            </button>
                            <span class="flex-grow ${task.completed ? 'line-through text-gray-400' : 'text-gray-700 dark:text-gray-200'}">
                                ${task.text}
                            </span>
                        </div>
                        <button 
                            onclick="window.handleTaskRemove(${task.id})" 
                            class="text-gray-400 hover:text-red-500 transition-colors p-2">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    `;
                    tasksContainer.appendChild(taskElement);
                });
            }
            
            // Atrelar os eventos
            addTaskBtn.onclick = addTask;
            taskInput.onkeypress = (e) => {
                if (e.key === 'Enter') addTask();
            };

            // Expor funções globais para os atributos onclick
            window.handleTaskComplete = completeTask;
            window.handleTaskRemove = removeTask;

            // Inicialização
            initTheme();
            updateCounters();
            renderTasks();
        });
    </script>
</body>
</html>
